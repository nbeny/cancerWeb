fragment ArticleListFields on Article {
  id
  title
  slug
  status
  latestSeoScore
  createdAt
  updatedAt
  publishedAt
  author { id name }
  category { id name }
}

# Filtrage ET tri ont lieu côté serveur (voir `apps/api/src/articles/article-query.ts`) :
# `filter` porte désormais status/authorId/categoryId/tagIds/search/minSeoScore/
# publishedAfter/publishedBefore, et `sort` porte le tri. `totalCount` reflète
# le filtre appliqué — la pagination `/dashboard/articles` s'appuie dessus,
# plus sur une taille de lot récupérée côté client (voir Git history pour
# l'ancienne stratégie à 500 articles, abandonnée : silencieusement fausse
# au-delà de cette limite).
query Articles($domainId: ID!, $filter: ArticleFilter, $sort: ArticleSort, $page: PageInput) {
  articles(domainId: $domainId, filter: $filter, sort: $sort, page: $page) {
    items { ...ArticleListFields }
    totalCount
  }
}

mutation CreateArticle($domainId: ID!, $input: CreateArticleInput!) {
  createArticle(domainId: $domainId, input: $input) {
    id
    title
    slug
    status
  }
}

query ArticleCategories($domainId: ID!) {
  categories(domainId: $domainId) {
    id
    name
    slug
  }
}

# ---------------------------------------------------------------------------
# Éditeur d'article (Task 16). `ArticleEditorFields` porte les champs
# affichés/édités par l'écran d'édition — contenu et HTML déjà sanitizé côté
# serveur (`renderedHtml`, jamais réinterprété côté client). Élargi à la
# Task 17 avec les métadonnées SEO, la catégorie et les tags.
# ---------------------------------------------------------------------------

fragment ArticleEditorFields on Article {
  id
  domainId
  title
  slug
  status
  content
  renderedHtml
  latestSeoScore
  currentVersion
  wordCount
  createdAt
  updatedAt
  author { id name }
}

query Article($domainId: ID!, $id: ID!) {
  article(domainId: $domainId, id: $id) { ...ArticleEditorFields }
}

mutation UpdateArticle($domainId: ID!, $id: ID!, $input: UpdateArticleInput!) {
  updateArticle(domainId: $domainId, id: $id, input: $input) { ...ArticleEditorFields }
}
