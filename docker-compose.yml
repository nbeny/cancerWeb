name: cancerweb

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cancerweb
      POSTGRES_PASSWORD: cancerweb
      POSTGRES_DB: cancerweb
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cancerweb -d cancerweb"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cancerweb
      POSTGRES_PASSWORD: cancerweb
      POSTGRES_DB: cancerweb_test
    ports: ["5434:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cancerweb -d cancerweb_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
